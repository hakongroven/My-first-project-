<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Triksing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Triksing til jul</title>
<style>
  :root {
    --bg: #0f3d2e;
    --bg2: #145a41;
    --card: #ffffff;
    --ink: #1b2a24;
    --muted: #5d6e66;
    --red: #d7263d;
    --gold: #f4b400;
    --green: #1f9d55;
    --line: #e4ebe7;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  header { color: #fff; text-align: center; padding: 8px 0 4px; }
  header h1 { margin: 0; font-size: 1.8rem; letter-spacing: .5px; }
  header p { margin: 4px 0 0; opacity: .85; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .countdown { display: flex; justify-content: center; gap: 10px; text-align: center; }
  .countdown div { background: rgba(255,255,255,.12); color: #fff; border-radius: 14px; padding: 10px 14px; min-width: 92px; }
  .countdown b { display: block; font-size: 1.9rem; line-height: 1.1; }
  .countdown span { font-size: .8rem; opacity: .85; }

  .hero { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; }
  .ring { position: relative; width: 140px; height: 140px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .label b { font-size: 1.9rem; line-height: 1; }
  .ring .label span { font-size: .8rem; color: var(--muted); }
  .stats { display: grid; gap: 8px; }
  .stat { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: .95rem; }
  .stat:last-child { border-bottom: 0; }
  .stat b { white-space: nowrap; }

  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }
  input, textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 12px; border-radius: 12px;
    border: 2px solid var(--line); background: #f8fbf9; color: var(--ink);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--green); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 12px; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .quick button { flex: 1 1 60px; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 14px;
    cursor: pointer; background: #eef4f1; color: var(--ink);
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--red); color: #fff; width: 100%; font-size: 1.1rem; padding: 16px; }
  button.small { padding: 6px 10px; font-size: .85rem; }
  button.ghost { background: transparent; color: var(--muted); }

  .chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 120px; }
  .bar { background: var(--green); border-radius: 6px 6px 2px 2px; min-height: 3px; position: relative; }
  .bar.today { background: var(--red); }
  .bar.zero { background: var(--line); }
  .chart-labels { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 4px; font-size: .65rem; color: var(--muted); text-align: center; }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .badge { text-align: center; padding: 10px 6px; border-radius: 14px; background: #f3f6f4; font-size: .78rem; color: var(--muted); }
  .badge .ico { font-size: 1.8rem; display: block; filter: grayscale(1); opacity: .35; }
  .badge.got { background: #fff6d6; color: var(--ink); }
  .badge.got .ico { filter: none; opacity: 1; }

  .history { list-style: none; padding: 0; margin: 0; }
  .history li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .history .min { font-weight: 800; min-width: 64px; }
  .history .info { flex: 1; min-width: 0; }
  .history .date { font-size: .85rem; color: var(--muted); }
  .history .note { font-size: .9rem; overflow-wrap: anywhere; }
  .empty { color: var(--muted); text-align: center; padding: 8px 0; }

  details summary { cursor: pointer; font-weight: 700; }
  .settings { display: grid; gap: 12px; margin-top: 12px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: #111; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600;
    transition: transform .3s ease; z-index: 50; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .confetti { position: fixed; top: -20px; font-size: 1.6rem; pointer-events: none; z-index: 40; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

  @media (max-width: 420px) {
    .hero { grid-template-columns: 1fr; justify-items: center; }
    .stats { width: 100%; }
    .countdown div { min-width: 0; flex: 1; padding: 10px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚽ Triksing til jul 🎄</h1>
    <p id="hello">Hvor mange minutter klarer du?</p>
  </header>

  <div class="countdown" id="countdown"></div>

  <section class="card">
    <div class="hero">
      <div class="ring">
        <svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#e4ebe7" stroke-width="14"/>
          <circle id="ringFg" cx="70" cy="70" r="60" fill="none" stroke="#d7263d" stroke-width="14"
                  stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"/>
        </svg>
        <div class="label"><b id="total">0</b><span>minutter</span></div>
      </div>
      <div class="stats">
        <div class="stat"><span>🎯 Mål</span><b id="goalTxt">–</b></div>
        <div class="stat"><span>📈 Igjen til målet</span><b id="leftTxt">–</b></div>
        <div class="stat"><span>⏱️ Må trikse per dag</span><b id="perDay">–</b></div>
        <div class="stat"><span>🔥 Dager på rad</span><b id="streak">0</b></div>
        <div class="stat"><span>🏆 Rekord (triks på rad)</span><b id="record">–</b></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Registrer triksing</h2>
    <form id="form" autocomplete="off">
      <div class="quick">
        <button type="button" data-add="5">+5</button>
        <button type="button" data-add="10">+10</button>
        <button type="button" data-add="15">+15</button>
        <button type="button" data-add="30">+30</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="minutes">Minutter</label>
          <input id="minutes" type="number" inputmode="numeric" min="1" max="600" placeholder="f.eks. 20" required>
        </div>
        <div class="field">
          <label for="date">Dato</label>
          <input id="date" type="date" required>
        </div>
      </div>
      <div class="field">
        <label for="tricks">Flest triks på rad i dag (valgfritt)</label>
        <input id="tricks" type="number" inputmode="numeric" min="0" max="100000" placeholder="f.eks. 57">
      </div>
      <div class="field">
        <label for="note">Notat (valgfritt)</label>
        <input id="note" type="text" maxlength="120" placeholder="f.eks. Lærte around the world!">
      </div>
      <button class="primary" type="submit">Lagre ⚽</button>
    </form>
  </section>

  <section class="card">
    <h2>Siste 14 dager</h2>
    <div class="chart" id="chart"></div>
    <div class="chart-labels" id="chartLabels"></div>
  </section>

  <section class="card">
    <h2>Merker</h2>
    <div class="badges" id="badges"></div>
  </section>

  <section class="card">
    <h2>Historikk</h2>
    <ul class="history" id="history"></ul>
  </section>

  <section class="card">
    <details>
      <summary>⚙️ Innstillinger</summary>
      <div class="settings">
        <div class="row">
          <div>
            <label for="name">Navn</label>
            <input id="name" type="text" maxlength="30" placeholder="Ditt navn">
          </div>
          <div>
            <label for="goal">Mål (minutter)</label>
            <input id="goal" type="number" inputmode="numeric" min="1" max="100000">
          </div>
        </div>
        <button type="button" id="saveSettings">Lagre innstillinger</button>
        <div>
          <label>Sikkerhetskopi</label>
          <div class="btns">
            <button type="button" class="small" id="exportBtn">Last ned kopi</button>
            <button type="button" class="small" id="importBtn">Hent fra kopi</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
        </div>
        <button type="button" class="ghost small" id="resetBtn">Slett alt og start på nytt</button>
      </div>
    </details>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'triksing-til-jul-v1';
  const DEFAULT = { name: '', goal: 1000, entries: [] };

  // ---------- lagring ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULT);
      const d = JSON.parse(raw);
      return { ...DEFAULT, ...d, entries: Array.isArray(d.entries) ? d.entries : [] };
    } catch { return structuredClone(DEFAULT); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch { toast('Klarte ikke å lagre – ta en sikkerhetskopi!'); }
  }
  let state = load();

  // ---------- datoer ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const DAY = 86400000;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysBetween = (a, b) => Math.round((b - a) / DAY);

  function christmas() {
    const t = today();
    let x = new Date(t.getFullYear(), 11, 24);
    if (t > x) x = new Date(t.getFullYear() + 1, 11, 24);
    return x;
  }

  const fmtDate = s => parse(s).toLocaleDateString('no-NO', { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtMin = m => m >= 60 ? `${m} min (${Math.floor(m / 60)} t ${m % 60} m)` : `${m} min`;

  // ---------- beregninger ----------
  const total = () => state.entries.reduce((s, e) => s + e.minutes, 0);
  function byDay() {
    const map = {};
    for (const e of state.entries) map[e.date] = (map[e.date] || 0) + e.minutes;
    return map;
  }
  function streak() {
    const map = byDay();
    let d = today(), n = 0;
    if (!map[iso(d)]) d = addDays(d, -1); // i dag teller ikke mot deg før dagen er over
    while (map[iso(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestStreak() {
    const days = Object.keys(byDay()).sort();
    let best = 0, cur = 0, prev = null;
    for (const s of days) {
      const d = parse(s);
      cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1;
      best = Math.max(best, cur); prev = d;
    }
    return best;
  }
  const record = () => state.entries.reduce((m, e) => Math.max(m, e.tricks || 0), 0);

  // ---------- visning ----------
  const $ = id => document.getElementById(id);

  function renderCountdown() {
    const days = daysBetween(today(), christmas());
    const weeks = Math.floor(days / 7);
    const html = days === 0
      ? `<div style="flex:1"><b>🎅 God jul!</b><span>Det er julaften!</span></div>`
      : `<div><b>${days}</b><span>dager til jul</span></div>
         <div><b>${weeks}</b><span>uker</span></div>
         <div><b>${days * 24}</b><span>timer (ca.)</span></div>`;
    $('countdown').innerHTML = html;
  }

  function render() {
    renderCountdown();
    const t = total();
    const goal = state.goal;
    $('hello').textContent = state.name ? `Heia ${state.name}! Hvor mange minutter klarer du?` : 'Hvor mange minutter klarer du?';
    $('total').textContent = t;
    $('goalTxt').textContent = `${goal} min`;
    const left = Math.max(0, goal - t);
    $('leftTxt').textContent = left === 0 ? 'Nådd! 🎉' : `${left} min`;
    const daysLeft = daysBetween(today(), christmas()) + 1; // inkludert i dag
    $('perDay').textContent = left === 0 ? '–' : `${Math.ceil(left / daysLeft)} min`;
    $('streak').textContent = streak();
    const r = record();
    $('record').textContent = r ? r : '–';

    const pct = Math.min(1, t / goal);
    $('ringFg').style.strokeDashoffset = 377 * (1 - pct);
    $('ringFg').style.stroke = pct >= 1 ? '#f4b400' : '#d7263d';

    renderChart(); renderBadges(); renderHistory();
  }

  function renderChart() {
    const map = byDay();
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(addDays(today(), -i));
    const max = Math.max(30, ...days.map(d => map[iso(d)] || 0));
    const todayIso = iso(today());
    $('chart').innerHTML = days.map(d => {
      const v = map[iso(d)] || 0;
      const h = Math.max(3, (v / max) * 100);
      const cls = v === 0 ? 'bar zero' : iso(d) === todayIso ? 'bar today' : 'bar';
      return `<div class="${cls}" style="height:${h}%" title="${fmtDate(iso(d))}: ${v} min"></div>`;
    }).join('');
    $('chartLabels').innerHTML = days.map(d => `<span>${d.getDate()}</span>`).join('');
  }

  const BADGES = [
    { ico: '⚽', name: 'Første økt', ok: s => s.count >= 1 },
    { ico: '⏰', name: '1 time', ok: s => s.total >= 60 },
    { ico: '🥉', name: '5 timer', ok: s => s.total >= 300 },
    { ico: '🥈', name: '10 timer', ok: s => s.total >= 600 },
    { ico: '🥇', name: '20 timer', ok: s => s.total >= 1200 },
    { ico: '🔥', name: '3 dager på rad', ok: s => s.best >= 3 },
    { ico: '💪', name: '7 dager på rad', ok: s => s.best >= 7 },
    { ico: '🌟', name: '14 dager på rad', ok: s => s.best >= 14 },
    { ico: '🚀', name: '60 min på én dag', ok: s => s.maxDay >= 60 },
    { ico: '💯', name: '100 triks på rad', ok: s => s.record >= 100 },
    { ico: '🎯', name: 'Nådd målet', ok: s => s.total >= s.goal },
    { ico: '🎄', name: 'Triksa på julaften', ok: s => s.xmas },
  ];

  function renderBadges() {
    const map = byDay();
    const s = {
      count: state.entries.length, total: total(), best: bestStreak(), record: record(),
      goal: state.goal, maxDay: Math.max(0, ...Object.values(map)),
      xmas: Object.keys(map).some(d => d.endsWith('-12-24')),
    };
    $('badges').innerHTML = BADGES.map(b =>
      `<div class="badge ${b.ok(s) ? 'got' : ''}"><span class="ico">${b.ico}</span>${b.name}</div>`).join('');
    return BADGES.filter(b => b.ok(s)).map(b => b.name);
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderHistory() {
    const list = [...state.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    $('history').innerHTML = list.length ? list.map(e => `
      <li>
        <span class="min">${e.minutes} min</span>
        <div class="info">
          <div class="date">${fmtDate(e.date)}${e.tricks ? ` · ${e.tricks} triks på rad` : ''}</div>
          ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
        </div>
        <button class="small ghost" data-del="${e.id}" aria-label="Slett">✕</button>
      </li>`).join('') : '<li class="empty">Ingen økter ennå – ut og triks! ⚽</li>';
  }

  // ---------- effekter ----------
  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function confetti(n = 30) {
    const icons = ['⚽', '🎄', '⭐', '🎉', '❄️'];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'confetti';
      el.textContent = icons[i % icons.length];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
      el.style.animationDelay = Math.random() * .4 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }
  const CHEERS = ['Rått! 🔥', 'Sterkt jobba! 💪', 'Messi-nivå! 🐐', 'Fortsett sånn! ⚽', 'Du blir bedre for hver dag! 🚀'];

  // ---------- hendelser ----------
  $('date').value = iso(today());
  $('date').max = iso(christmas());

  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const cur = parseInt($('minutes').value, 10) || 0;
    $('minutes').value = cur + Number(b.dataset.add);
  }));

  $('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const minutes = parseInt($('minutes').value, 10);
    if (!minutes || minutes < 1) return toast('Skriv inn antall minutter');
    if (minutes > 600) return toast('Over 10 timer på én gang? Sjekk tallet 😉');
    const before = renderBadges();
    const tricks = parseInt($('tricks').value, 10) || 0;
    const prevRecord = record();
    state.entries.push({
      id: Date.now(), date: $('date').value || iso(today()), minutes,
      tricks: tricks > 0 ? tricks : undefined, note: $('note').value.trim() || undefined,
    });
    save(); render();
    const after = renderBadges();
    const newBadges = after.filter(b => !before.includes(b));
    $('minutes').value = ''; $('tricks').value = ''; $('note').value = '';
    $('date').value = iso(today());
    if (newBadges.length) { toast(`Nytt merke: ${newBadges.join(', ')}! 🏅`); confetti(45); }
    else if (tricks > prevRecord && prevRecord > 0) { toast(`Ny rekord: ${tricks} triks på rad! 🏆`); confetti(40); }
    else { toast(`${CHEERS[Math.floor(Math.random() * CHEERS.length)]} +${minutes} min`); confetti(18); }
  });

  $('history').addEventListener('click', ev => {
    const btn = ev.target.closest('[data-del]');
    if (!btn) return;
    if (!confirm('Slette denne økta?')) return;
    state.entries = state.entries.filter(e => String(e.id) !== btn.dataset.del);
    save(); render();
  });

  $('name').value = state.name;
  $('goal').value = state.goal;
  $('saveSettings').addEventListener('click', () => {
    state.name = $('name').value.trim();
    const g = parseInt($('goal').value, 10);
    if (g > 0) state.goal = g;
    save(); render(); toast('Innstillinger lagret ✅');
  });

  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `triksing-${iso(today())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!Array.isArray(d.entries)) throw new Error();
      if (!confirm(`Erstatte dataene med kopien (${d.entries.length} økter)?`)) return;
      state = { ...DEFAULT, ...d };
      $('name').value = state.name; $('goal').value = state.goal;
      save(); render(); toast('Kopi hentet ✅');
    } catch { toast('Fant ikke gyldige data i fila'); }
    ev.target.value = '';
  });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm('Er du HELT sikker? Alle øktene blir slettet.')) return;
    state = structuredClone(DEFAULT);
    $('name').value = ''; $('goal').value = state.goal;
    save(); render();
  });

  render();
  setInterval(renderCountdown, 60 * 1000);
})();
</script>
</body>
</html>
